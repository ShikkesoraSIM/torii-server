services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: g0v0-server-app
    container_name: osu_api_server
    ports:
      - "127.0.0.1:9000:8000"
    env_file:
      - .env
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["uv","run","--no-sync","uvicorn","main:app","--host","0.0.0.0","--port","8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      performance-server:
        condition: service_started
      performance-server-mania:
        condition: service_started
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
      - ./newrelic.ini:/app/newrelic.ini:ro
      - ./config:/app/config
      - ./geoip:/app/geoip
      - ./replays:/app/replays
      - ./storage:/app/storage
    restart: unless-stopped
    networks:
      - osu-network

  adminer:
    image: adminer:latest
    container_name: g0v0-server-adminer-1
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - osu-network

  mysql:
    image: mysql:8.0
    command:
      - "--max-connections=500"
      - "--innodb-buffer-pool-size=2G"
    container_name: osu_api_mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: "UTC"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped
    networks:
      - osu-network

  redis:
    image: redis:7-alpine
    container_name: osu_api_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 10s
      start_period: 10s
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - osu-network

  performance-server:
    build:
      # Contexto propio en net10, separado del de mania.
      #
      # nova es .NET 10 y el contexto viejo compila con el SDK 8, asi que apuntarlo a
      # nuestro fork ahi tira NETSDK1045. No se puede bumpear el compartido: mania se
      # construye del fork de Sunny (vernonlim), que es net8, y se lo llevaria puesto.
      context: ./docker/performance-server-net10
      dockerfile: Dockerfile
      args:
        # Los calculadores salen de NUESTRO fork, no de ppy.
        #
        # Esto apuntaba a ppy/osu rama pp-dev, asi que el rework de flow aim para relax
        # (torii-osu PR #9 de Aideddo: washing machine por geometria + SmallCircleBonus
        # anulado con relax) existia en el cliente y NUNCA corria aca. El 21-jul se
        # construyo una imagen a mano desde el fork y anduvo bien; el 24-jul un
        # `compose up --build` de rutina la piso con una build de ppy y volvio el pp
        # inflado, sin que nadie tocara nada.
        #
        # Y va SHA fijo, nunca una rama: `pp-dev` se mueve sola, asi que cada rebuild
        # traia otro calculo distinto y el cliente (que si esta pinneado) nunca podia
        # coincidir. Este SHA corresponde al master actual con PR #50 y PR #51.
        PERF_SERVER_REF: b02fb99369cdeeabe19bedf3de4e57263a6d9509
        OSU_REPO: https://github.com/ShikkesoraSIM/torii.git
        OSU_REF: ed9649c3c010f285d177b5524dc41a664cfbbbd0
        FRAMEWORK_REF: b29d1347c21a952cc7bf68f9e02e4f65c40c2c14
        RESOURCES_REF: ff6ab6c894f6bb0fbdc3ce65e0568bcf09e863e5
    image: g0v0-performance-server-ppdev
    container_name: performance_server
    environment:
      - SAVE_BEATMAP_FILES=false
    volumes:
      - ./rulesets:/data/rulesets
    restart: unless-stopped
    networks:
      - osu-network

  # perf-server aparte solo para la dificultad de mania, con el osu del Sunny
  # rework (el mismo que corre el cliente). el de arriba (ppdev/reading) sigue
  # para std/rx. g0v0 apunta mania aca via MANIA_CALCULATOR_CONFIG.
  performance-server-mania:
    build:
      context: ./docker/performance-server-author-port
      dockerfile: Dockerfile
      args:
        OSU_REPO: https://github.com/vernonlim/osu.git
        OSU_REF: c2f5ac34625264846a4379e313b96fc4debd06ac
    image: g0v0-performance-server-mania-sunny
    container_name: performance_server_mania
    environment:
      - SAVE_BEATMAP_FILES=false
    volumes:
      - ./rulesets:/data/rulesets
    restart: unless-stopped
    networks:
      - osu-network

volumes:
  mysql_data:
  redis_data:

networks:
  osu-network:
    driver: bridge
